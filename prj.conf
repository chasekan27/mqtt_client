# --- Core Options ---
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_HWINFO=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=81984
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048


# --- Flash & File System ---
CONFIG_NET_BUF=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=n

# --- Diagnostics & Shell ---
CONFIG_LOG=y
CONFIG_SHELL=n

# --- Networking Stack Core ---
CONFIG_NETWORKING=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_INIT_STACKS=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2048
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y

# --- Network Buffers (Optimized for ESP32 DRAM) ---
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SHELL=n

# --- Wi-Fi Subsystem ---
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_STA_AUTO_DHCPV4=y

# --- DNS Resolution ---
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_NUM_CONCUR_QUERIES=2
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"

# --- HiveMQ Target Settings ---
CONFIG_MQTT_LIB=y
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MOSQUITTO_CLIENT_ID="zephyr-123234"
CONFIG_MOSQUITTO_HOSTNAME="dc69f81904184c9eb8612ea26d2fa1bf.s1.eu.hivemq.cloud"
CONFIG_MOSQUITTO_SERVER_PORT=8883
CONFIG_MOSQUITTO_USERNAME="zephyr_client"
CONFIG_MOSQUITTO_PASSWORD="Tvadivel1."

# --- Secure TLS Layer Configuration ---
CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MQTT_LIB_TLS=y

# --- Mbed TLS Subsystem Options ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=49152
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=16384
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_PEM_WRITE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y

# --- Watchdog ---
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=500

# --- App Settings & Targets ---
CONFIG_POSIX_API=y
CONFIG_SENSOR=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y